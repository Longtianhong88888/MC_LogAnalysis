name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      shell: bash
      run: |
        python -m unittest discover -s tests -v 2>&1 | tee test_output.log
        status=${PIPESTATUS[0]}
        exit $status

    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-test-log
        path: test_output.log

    - name: Build with PyInstaller
      run: |
        # 注意：PPT 模板含内部数据，不随包内置，由用户放置到 exe 同目录
        pyinstaller --onedir --windowed --icon log.ico --add-data "Machine.png;." --add-data "log.ico;." --name MC_LogAnalysis main.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MC_LogAnalysis_Windows
        path: dist/MC_LogAnalysis/
